<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>InstaGift</title>
<style>
body {
    margin: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.story {
    width: 360px;
    height: 640px;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
}

.story img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.botao-click {
    position: absolute;
    top: 73%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 120px;
    height: 120px;
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
}
</style>
</head>
<body>

<div class="story">
    <!-- imagem gerada automaticamente pelo api.py -->
    <img src="/story-base.png">

    <a href="/vitrine">
        <div class="botao-click"></div>
    </a>
</div>

</body>
</html>
