<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaGift - Criar Lista</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0D0D0D; font-family: 'Inter', sans-serif; color: #fff; min-height: 100vh; }
        .app-container { max-width: 420px; margin: 0 auto; min-height: 100vh; padding: 16px; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 0 24px 0; border-bottom: 1px solid #1a1a1a; }
        .logo-box { background-color: #8A63D2; color: #000; font-weight: 800; padding: 6px 14px; font-size: 26px; border-radius: 6px; display: inline-block; letter-spacing: -0.5px; }
        .tagline { font-size: 13px; color: #A6A6A6; margin-top: 6px; }
        .header-stars { font-size: 22px; color: #8A63D2; opacity: 0.7; }
        .card { background-color: #121212; border-radius: 20px; padding: 20px; margin-top: 20px; border: 1px solid #1a1a1a; box-shadow: 0 0 15px rgba(138, 99, 210, 0.08); animation: fadeUp 0.4s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        h2 { font-size: 15px; margin-bottom: 14px; font-weight: 500; color: #eee; }
        .platform-chips { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .chip { font-size: 11px; background: #1a1a1a; padding: 4px 12px; border-radius: 20px; color: #D4AF37; border: 1px solid #2a2a2a; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"], input[type="email"] { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 11px 14px; color: #fff; font-size: 14px; outline: none; font-family: 'Inter', sans-serif; width: 100%; }
        input[type="text"]::placeholder, input[type="email"]::placeholder { color: #555; }
        input[type="text"]:focus, input[type="email"]:focus { border-color: #8A63D2; }
        .btn-add { background: #8A63D2; border: none; padding: 11px 18px; border-radius: 10px; color: #fff; font-weight: 700; cursor: pointer; font-size: 14px; transition: transform 0.2s, background 0.2s; font-family: 'Inter', sans-serif; }
        .btn-add:hover { background: #9d7ae0; transform: scale(1.05); }
        .btn-add:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .loading { text-align: center; color: #8A63D2; padding: 12px 0; font-size: 14px; display: none; }
        .aviso-link { background: #1a0d00; border: 1px solid #ff9900; border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 12px; color: #ff9900; display: none; line-height: 1.5; }
        .aviso-btns { display: flex; gap: 10px; margin-top: 10px; }
        .aviso-btns button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; font-family: 'Inter', sans-serif; }
        .btn-continuar { background: #8A63D2; color: white; }
        .btn-voltar-aviso { background: #333; color: white; }

        /* EMAIL BOX */
        .email-box { background: #0d0d1a; border: 1px solid #8A63D2; border-radius: 14px; padding: 16px; margin-top: 20px; }
        .email-box p { font-size: 12px; color: #aaa; margin-bottom: 10px; line-height: 1.5; }
        .email-box input { margin-bottom: 10px; }
        .btn-salvar-email { width: 100%; background: #8A63D2; border: none; border-radius: 10px; padding: 12px; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; }
        .btn-salvar-email:hover { background: #9d7ae0; }
        .email-salvo { font-size: 12px; color: #22c55e; margin-top: 8px; text-align: center; display: none; }

        .list-section h2 span { color: #8A63D2; }
        .product-card { background: #1a1a1a; border-radius: 16px; margin-bottom: 14px; overflow: hidden; border: 1px solid #2a2a2a; box-shadow: 0 0 10px rgba(138, 99, 210, 0.06); animation: fadeUp 0.3s ease; }
        .product-img-wrap { background: radial-gradient(circle, #1e1e1e 0%, #121212 100%); text-align: center; padding: 20px; }
        .product-img-wrap img { width: 100%; max-height: 180px; object-fit: contain; border-radius: 10px; }
        .product-img-placeholder { font-size: 48px; padding: 20px 0; }
        .product-info { padding: 14px 16px; }
        .product-nome { font-size: 14px; font-weight: 600; color: #eee; margin-bottom: 6px; line-height: 1.4; }
        .product-preco { font-size: 16px; font-weight: 700; color: #8A63D2; margin-bottom: 10px; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; }
        .platform-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .badge-amazon { background: #FF9900; color: #000; }
        .badge-mercadolivre { background: #FFE600; color: #000; }
        .badge-shopee { background: #EE4D2D; color: #fff; }
        .badge-outro { background: #333; color: #fff; }
        .btn-remover { background: transparent; border: none; color: #555; font-size: 18px; cursor: pointer; line-height: 1; transition: color 0.2s; }
        .btn-remover:hover { color: #ff4444; }
        .link-permanente { background: #121212; border: 1px solid #2a2a2a; border-radius: 14px; padding: 16px; margin-top: 20px; text-align: center; }
        .link-permanente p { font-size: 12px; color: #888; margin-bottom: 8px; }
        .link-permanente code { font-size: 11px; color: #8A63D2; word-break: break-all; }
        .btn-copiar { background: #1a1a1a; border: 1px solid #8A63D2; color: #8A63D2; padding: 8px 16px; border-radius: 8px; margin-top: 10px; cursor: pointer; font-size: 13px; font-family: 'Inter', sans-serif; transition: background 0.2s; }
        .btn-copiar:hover { background: #8A63D2; color: #fff; }
        .empty-state { text-align: center; padding: 30px 0; color: #444; font-size: 14px; }
        .empty-state .emoji { font-size: 40px; margin-bottom: 10px; }
        .acoes { margin-top: 24px; margin-bottom: 30px; display: flex; flex-direction: column; gap: 12px; }
        .btn-criar-story { width: 100%; background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); border: none; border-radius: 14px; padding: 16px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: transform 0.2s; }
        .btn-criar-story:hover { transform: translateY(-2px); }
        .btn-gerar-vitrine { width: 100%; background: linear-gradient(135deg, #8A63D2, #6a43b2); border: none; border-radius: 14px; padding: 16px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 20px rgba(138, 99, 210, 0.3); }
        .btn-gerar-vitrine:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(138, 99, 210, 0.45); }
        .btn-ver-vitrine { width: 100%; background: transparent; border: 1px solid #8A63D2; border-radius: 14px; padding: 14px; color: #8A63D2; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.2s; }
