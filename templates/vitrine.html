<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstaGift — Vitrine</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #060612; color: #fff; font-family: Arial, sans-serif; min-height: 100vh; padding: 24px 16px 48px; }
.container { max-width: 500px; margin: 0 auto; }
.topo { text-align: center; margin-bottom: 28px; }
.topo h2 { font-size: 22px; font-weight: 700; }
.topo p { font-size: 13px; color: #888; margin-top: 4px; }
.grid { display: flex; flex-direction: column; gap: 14px; }
.card { background: #111; border: 1px solid #222; border-radius: 14px; overflow: hidden; }
.card-img { width: 100%; height: 200px; object-fit: cover; display: block; }
.card-sem-img { width: 100%; height: 120px; background: #1a1a2e; display: flex; align-items: center; justify-content: center; font-size: 48px; }
.card-body { padding: 16px; }
.card-nome { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.card-preco { font-size: 15px; color: #7F77DD; font-weight: 700; margin-bottom: 12px; }
.btn-comprar { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn-amazon { background: #ff9900; color: #000; }
.btn-mercadolivre { background: #FFE600; color: #000; }
.btn-shopee { background: #EE4D2D; color: #fff; }
.btn-outro { background: #7F77DD; color: #fff; }
.reservado { background: #333; color: #666; cursor: not-allowed; }
.badge-reservado { text-align: center; font-size: 12px; color: #888; margin-top: 6px; }
.loading { text-align: center; padding: 60px; color: #888; }
</style>
</head>
<body>
<div class="container">
  <div class="topo">
    <h2>Lista de Presentes</h2>
    <p id="subtitulo">Carregando...</p>
  </div>
  <div class="grid" id="grid">
    <div class="loading">Buscando presentes...</div>
  </div>
</div>

<script>
var listaId = "{{ lista_id }}";

var btnInfo = {
  amazon: {classe: 'btn-amazon', texto: '🛒 Comprar na Amazon'},
  mercadolivre: {classe: 'btn-mercadolivre', texto: '🛍️ Comprar no Mercado Livre'},
  shopee: {classe: 'btn-shopee', texto: '🧡 Comprar na Shopee'},
  outro: {classe: 'btn-outro', texto: '🔗 Ver produto'}
};

async function carregarLista() {
  try {
    var res = await fetch('/api/produtos/' + listaId);
    var produtos = await res.json();
    document.getElementById('subtitulo').textContent = produtos.length + ' presente(s) na lista';
    renderProdutos(produtos);
  } catch(e) {
    document.getElementById('grid').innerHTML = '<div class="loading">Lista nao encontrada.</div>';
  }
}

function renderProdutos(produtos) {
  var grid = document.getElementById('grid');
  if (!produtos.length) {
    grid.innerHTML = '<div class="loading">Nenhum produto na lista ainda.</div>';
    return;
  }
  var info;
  grid.innerHTML = produtos.map(function(p) {
    info = btnInfo[p.plataforma] || btnInfo['outro'];
    return '<div class="card">' +
      (p.imagem_url
        ? '<img class="card-img" src="' + p.imagem_url + '" onerror="this.style.display=\'none\'">'
        : '<div class="card-sem-img">🎁</div>') +
      '<div class="card-body">' +
        '<div class="card-nome">' + p.nome + '</div>' +
        (p.preco ? '<div class="card-preco">R$ ' + p.preco + '</div>' : '') +
        (p.reservado
          ? '<div class="btn-comprar reservado">Presente ja escolhido</div>' +
            '<div class="badge-reservado">Alguem ja escolheu este presente</div>'
          : '<a href="' + p.link_afiliado + '" target="_blank" class="btn-comprar ' + info.classe + '">' + info.texto + '</a>') +
      '</div>' +
    '</div>';
  }).join('');
}

carregarLista();
</script>
</body>
</html>
