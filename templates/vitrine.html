<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FestStory — Lista de Presentes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #FFF8EC; color: #2C2C2C; font-family: 'Inter', sans-serif; min-height: 100vh; padding: 20px 16px 60px; }
.topo { text-align: center; padding: 24px 0 20px; border-bottom: 1px solid rgba(201,168,76,0.2); margin-bottom: 24px; }
.logo { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: #C9A84C; margin-bottom: 4px; }
.logo-sub { font-size: 11px; color: #aaa; letter-spacing: 0.1em; margin-bottom: 12px; }
.topo h2 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: #2C2C2C; margin-bottom: 4px; }
.topo p { font-size: 13px; color: #aaa; font-style: italic; font-family: 'Playfair Display', serif; }
.grid { display: flex; flex-direction: column; gap: 16px; max-width: 420px; margin: 0 auto; }
.card { background: #fff; border: 1px solid rgba(201,168,76,0.15); border-radius: 18px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04); transition: all 0.2s; }
.card:hover { border-color: rgba(201,168,76,0.35); box-shadow: 0 6px 24px rgba(201,168,76,0.1); }
.card img { width: 100%; height: 180px; object-fit: cover; display: block; }
.card-sem-img { width: 100%; height: 100px; background: linear-gradient(135deg, #FFF8EC, #F5EDD8); display: flex; align-items: center; justify-content: center; font-size: 40px; }
.card-body { padding: 16px 18px; }
.product-ornamento { font-size: 10px; color: #C9A84C; letter-spacing: 4px; margin-bottom: 6px; text-align: center; }
.card-nome { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; margin-bottom: 6px; color: #2C2C2C; text-align: center; }
.card-preco { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; color: #C9A84C; margin-bottom: 14px; text-align: center; }
.btn-grupo { display: flex; gap: 10px; }
.btn-ver { flex: 1; padding: 12px; background: transparent; color: #C9A84C; border: 1px solid rgba(201,168,76,0.4); border-radius: 50px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; }
.btn-ver:hover { background: rgba(201,168,76,0.06); border-color: #C9A84C; }
.btn-reservar { flex: 1; padding: 12px; background: linear-gradient(135deg, #C9A84C, #A8722A); color: #fff; border: none; border-radius: 50px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; box-shadow: 0 4px 16px rgba(201,168,76,0.3); }
.btn-reservar:hover { transform: translateY(-2px); }
.btn-reservar:disabled { background: rgba(0,0,0,0.06); color: #bbb; cursor: not-allowed; box-shadow: none; transform: none; }
.btn-reservar-unico { width: 100%; padding: 13px; background: linear-gradient(135deg, #C9A84C, #A8722A); color: #fff; border: none; border-radius: 50px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; box-shadow: 0 4px 16px rgba(201,168,76,0.3); }
.btn-reservar-unico:hover { transform: translateY(-2px); }
.btn-reservar-unico:disabled { background: rgba(0,0,0,0.06); color: #bbb; cursor: not-allowed; box-shadow: none; transform: none; }
.reservado-badge { text-align: center; font-size: 12px; color: #aaa; margin-top: 8px; font-style: italic; font-family: 'Playfair Display', serif; }
.loading { text-align: center; padding: 60px; color: #aaa; font-family: 'Playfair Display', serif; font-style: italic; }
.erro { text-align: center; padding: 60px; color: #ef4444; font-family: 'Playfair Display', serif; font-style: italic; }

/* Modal */
.modal-bg { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(44,44,44,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal-bg.show { display: flex; }
.modal { background: #FFF8EC; border: 1px solid rgba(201,168,76,0.3); border-radius: 24px; padding: 32px 24px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
.modal-ornamento { color: #C9A84C; font-size: 12px; letter-spacing: 6px; margin-bottom: 14px; }
.modal h3 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #2C2C2C; }
.modal p { font-size: 13px; color: #aaa; margin-bottom: 16px; font-style: italic; font-family: 'Playfair Display', serif; }
.modal-produto { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; color: #C9A84C; margin-bottom: 20px; line-height: 1.4; }
.form-grupo { margin-bottom: 12px; text-align: left; }
.form-grupo label { font-size: 11px; color: #aaa; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.07em; }
.form-input { width: 100%; padding: 12px 16px; background: #fff; border: 1px solid rgba(201,168,76,0.25); border-radius: 12px; color: #2C2C2C; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; transition: all 0.2s; }
.form-input:focus { border-color: #C9A84C; box-shadow: 0 0 0 3px rgba(201,168,76,0.08); }
.form-input::placeholder { color: #ccc; }
.btn-confirmar { width: 100%; padding: 14px; background: linear-gradient(135deg, #C9A84C, #A8722A); color: #fff; border: none; border-radius: 50px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; margin-bottom: 10px; transition: all 0.2s; box-shadow: 0 4px 16px rgba(201,168,76,0.3); }
.btn-confirmar:hover { transform: translateY(-2px); }
.btn-cancelar { width: 100%; padding: 12px; background: transparent; color: #aaa; border: 1px solid rgba(201,168,76,0.2); border-radius: 50px; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<div class="topo">
  <div class="logo">FestStory</div>
  <div class="logo-sub">✦ &nbsp; ✦ &nbsp; ✦</div>
  <h2>🎁 Lista de presentes</h2>
  <p id="subtitulo">Carregando...</p>
</div>

<div class="grid" id="grid">
  <div class="loading">Buscando presentes...</div>
</div>

<!-- Modal de reserva -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-ornamento">✦ &nbsp; ✦ &nbsp; ✦</div>
    <h3>Que presente incrível!</h3>
    <p>Você está prestes a reservar:</p>
    <div class="modal-produto" id="modal-produto"></div>
    <div class="form-grupo">
      <label>Seu nome</label>
      <input class="form-input" type="text" id="nome-presenteador" placeholder="Como você se chama?">
    </div>
    <div class="form-grupo">
      <label>Seu e-mail</label>
      <input class="form-input" type="email" id="email-presenteador" placeholder="para confirmar a compra">
    </div>
    <button class="btn-confirmar" onclick="confirmarReserva()">✦ Reservar presente</button>
    <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
const listaId = "{{ lista_id }}";
let produtoSelecionado = null;
let linkProdutoSelecionado = null;

async function carregarLista() {
  try {
    const [resProdutos, resInfo] = await Promise.all([
      fetch(`/api/produtos/${listaId}`),
      fetch(`/api/lista-info/${listaId}`)
    ]);
    const produtos = await resProdutos.json();
    const info = await resInfo.json();
    document.getElementById('subtitulo').textContent = (info && info.nome) ? `Lista de ${info.nome}` : 'Escolha um presente especial';
    renderProdutos(Array.isArray(produtos) ? produtos : []);
  } catch(e) {
    document.getElementById('grid').innerHTML = '<div class="erro">Lista não encontrada.</div>';
  }
}

function renderProdutos(produtos) {
  const grid = document.getElementById('grid');
  if (!produtos.length) {
    grid.innerHTML = '<div class="loading">Nenhum presente na lista ainda.</div>';
    return;
  }
  grid.innerHTML = produtos.map(p => {
    const linkAfiliado = p.link_afiliado || p.link_original || '';
    const temLink = linkAfiliado && linkAfiliado.startsWith('http');

    // ✦ Produto já reservado ou confirmado
    if (p.reservado) {
      return `
        <div class="card">
          ${p.imagem_url ? `<img src="${p.imagem_url}" alt="${p.nome}" onerror="this.style.display='none'">` : `<div class="card-sem-img">🎁</div>`}
          <div class="card-body">
            <div class="product-ornamento">✦ ✦ ✦</div>
            <div class="card-nome">${p.nome || 'Presente'}</div>
            ${p.preco ? `<div class="card-preco">R$ ${p.preco}</div>` : ''}
            ${temLink ? `<div class="btn-grupo"><a href="${linkAfiliado}" target="_blank" class="btn-ver">🔗 Ver produto</a><button class="btn-reservar" disabled>${p.reservado === 2 ? '✓ Confirmado' : 'Já reservado'}</button></div>` : `<button class="btn-reservar-unico" disabled>${p.reservado === 2 ? '✓ Confirmado' : 'Já reservado'}</button>`}
            <div class="reservado-badge">Alguém já escolheu este presente ✦</div>
          </div>
        </div>`;
    }

    // ✦ Produto disponível — dois botões se tem link, um se não tem
    if (temLink) {
      return `
        <div class="card">
          ${p.imagem_url ? `<img src="${p.imagem_url}" alt="${p.nome}" onerror="this.style.display='none'">` : `<div class="card-sem-img">🎁</div>`}
          <div class="card-body">
            <div class="product-ornamento">✦ ✦ ✦</div>
            <div class="card-nome">${p.nome || 'Presente'}</div>
            ${p.preco ? `<div class="card-preco">R$ ${p.preco}</div>` : ''}
            <div class="btn-grupo">
              <a href="${linkAfiliado}" target="_blank" class="btn-ver">🔗 Ver produto</a>
              <button class="btn-reservar" onclick="abrirModal(${p.id}, '${(p.nome||'').replace(/'/g,"\\'")}', '${linkAfiliado}')">🎁 Reservar</button>
            </div>
          </div>
        </div>`;
    } else {
      return `
        <div class="card">
          ${p.imagem_url ? `<img src="${p.imagem_url}" alt="${p.nome}" onerror="this.style.display='none'">` : `<div class="card-sem-img">🎁</div>`}
          <div class="card-body">
            <div class="product-ornamento">✦ ✦ ✦</div>
            <div class="card-nome">${p.nome || 'Presente'}</div>
            ${p.preco ? `<div class="card-preco">R$ ${p.preco}</div>` : ''}
            <button class="btn-reservar-unico" onclick="abrirModal(${p.id}, '${(p.nome||'').replace(/'/g,"\\'")}', '')">🎁 Reservar presente</button>
          </div>
        </div>`;
    }
  }).join('');
}

function abrirModal(id, nome, link) {
  produtoSelecionado = id;
  linkProdutoSelecionado = link;
  document.getElementById('modal-produto').textContent = nome;
  document.getElementById('nome-presenteador').value = '';
  document.getElementById('email-presenteador').value = '';
  document.getElementById('modal').classList.add('show');
}

function fecharModal() {
  document.getElementById('modal').classList.remove('show');
  produtoSelecionado = null;
  linkProdutoSelecionado = null;
}

async function confirmarReserva() {
  if (!produtoSelecionado) return;
  const nome = document.getElementById('nome-presenteador').value.trim();
  const email = document.getElementById('email-presenteador').value.trim();
  if (!nome || !email) { alert('Preencha seu nome e e-mail para reservar!'); return; }
  try {
    const res = await fetch(`/api/reservar/${produtoSelecionado}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ nome, email })
    });
    const data = await res.json();
    if (data.ok) {
      fecharModal();
      carregarLista();
      // ✦ Se tem link do produto, abre para o comprador já ir comprar
      if (linkProdutoSelecionado) {
        setTimeout(function() {
          window.open(linkProdutoSelecionado, '_blank');
        }, 500);
      }
      alert('🎉 Presente reservado! Verifique seu e-mail para confirmar a compra.');
    } else {
      alert(data.erro || 'Erro ao reservar.');
    }
  } catch(e) {
    alert('Erro de conexão.');
  }
}

carregarLista();
</script>
</body>
</html>
